# Instalador e atualizações. O appId não pode mudar: é por ele que as atualizações acham a instalação.
appId: io.github.darci-jr.agent-ide
productName: Agent IDE
copyright: Copyright © Darci Jr

directories:
  output: dist
  buildResources: build

# Só o código compilado; o resto do repositório (e2e, src, dados de uso) fica de fora.
files:
  - out/**
  - package.json
  - "!**/*.map"

# O terminal é um módulo nativo: precisa estar fora do arquivo .asar para carregar.
asarUnpack:
  - node_modules/@lydell/node-pty*/**

win:
  target:
    - target: nsis
      arch: [x64]
  # Sem certificado por enquanto (nada a configurar): o Windows mostra o aviso do SmartScreen na
  # primeira instalação. As atualizações funcionam do mesmo jeito.

# Instala só para o usuário, sem pedir administrador, e atualiza sem perguntar onde.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agent IDE
  artifactName: Agent-IDE-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

# Mac: um .dmg para cada processador (Apple Silicon e Intel). Sem assinatura da Apple, o Mac pede
# liberação na primeira abertura e o app não se atualiza sozinho: avisa e abre a página para baixar.
# O .zip só existe para gerar o latest-mac.yml, que é onde o app vê que há versão nova.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  identity: null
  artifactName: Agent-IDE-${version}-mac-${arch}.${ext}

# Linux: AppImage roda em qualquer distribuição e se atualiza sozinho; .deb para Ubuntu e Debian.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: Darci Jr <Darci-Jr@users.noreply.github.com>
  synopsis: IDE centrada em agentes de código
  artifactName: Agent-IDE-${version}-linux-${arch}.${ext}

# Diz ao app instalado onde procurar atualizações. O envio para a release é do workflow, com o gh.
publish:
  provider: github
  owner: Darci-Jr
  repo: agent-ide
  releaseType: release
