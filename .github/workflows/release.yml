# Publica uma versão: ao enviar uma tag v1.2.3, compila e testa em Windows, Mac e Linux e põe os
# instaladores e os arquivos de atualização (latest*.yml) na mesma release.
# Rodado à mão (workflow_dispatch), só gera e testa os pacotes, sem publicar nada.
name: Publicar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacotes:
    strategy:
      matrix:
        include:
          - os: windows-latest
            alvo: --win
          - os: macos-latest
            alvo: --mac
          - os: ubuntu-latest
            alvo: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A tag e a versão do package.json precisam bater, ou o app atualizado diria a versão errada.
      - name: Confere a versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$versao" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $versao do package.json."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # O npm só instala o terminal nativo do processador da máquina. O pacote Intel do Mac é feito
      # numa máquina Apple Silicon: sem a versão x64 do node-pty, o terminal não abriria nele.
      - name: Terminal nativo das duas arquiteturas (Mac)
        if: runner.os == 'macOS'
        run: |
          versao=$(node -p "require('./node_modules/@lydell/node-pty/package.json').optionalDependencies['@lydell/node-pty-darwin-x64']")
          npm install --no-save --force "@lydell/node-pty-darwin-x64@$versao"

      - name: Gera os pacotes
        shell: bash
        run: npm run build && npx electron-builder ${{ matrix.alvo }} --publish never

      # A máquina é Apple Silicon e só abre o pacote dela: confere pelo conteúdo que cada pacote
      # do Mac leva o terminal nativo do seu processador.
      - name: Confere o terminal nativo nos pacotes do Mac
        if: runner.os == 'macOS'
        run: |
          for arch in arm64 x64; do
            unzip -l dist/Agent-IDE-*-mac-$arch.zip | grep -q "app.asar.unpacked/node_modules/@lydell/node-pty-darwin-$arch/" \
              || { echo "O pacote $arch não tem o node-pty-darwin-$arch"; exit 1; }
            echo "$arch: node-pty-darwin-$arch presente"
          done

      # Abre o app empacotado: terminal nativo fora do .asar, versão e atualizador.
      - name: Testa o app empacotado
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            xvfb-run -a node e2e/packaged.mjs
          else
            node e2e/packaged.mjs
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pacotes-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # O envio é do gh, não do electron-builder: o dele terminava antes de mandar tudo, sem acusar erro.
  publica:
    needs: pacotes
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true

      - name: Publica na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l pacotes
          # Sem um destes, os apps instalados daquele sistema não acham a versão nova.
          for f in latest.yml latest-mac.yml latest-linux.yml; do test -f "pacotes/$f" || { echo "Faltou $f"; exit 1; }; done
          gh release create "$GITHUB_REF_NAME" pacotes/* --title "${GITHUB_REF_NAME#v}" --generate-notes \
            --notes-file - <<'NOTAS'
          **Windows:** `Agent-IDE-Setup-<versão>.exe`. **Linux:** `.AppImage` (qualquer distribuição, se atualiza sozinho) ou `.deb`. **Mac (experimental, sem assinatura):** `.dmg` de `arm64` (Apple Silicon) ou `x64` (Intel); na primeira abertura, clique com o botão direito no app e escolha Abrir.
          NOTAS
          total=$(ls pacotes | wc -l)
          enviados=$(gh release view "$GITHUB_REF_NAME" --json assets -q '[.assets[] | select(.state == "uploaded")] | length')
          echo "arquivos: $total, enviados: $enviados"
          test "$total" = "$enviados"
