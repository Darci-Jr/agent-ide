# Publica uma versão: ao enviar uma tag v1.2.3, compila no Windows, testa e põe o instalador e os
# arquivos de atualização na release. O app instalado procura atualizações nessas releases.
name: Publicar versão

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A tag e a versão do package.json precisam bater, ou o app atualizado diria a versão errada.
      - name: Confere a versão
        shell: bash
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$versao" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $versao do package.json."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run dist

      # O envio é do gh, não do electron-builder: o dele terminava antes de mandar o instalador
      # inteiro e o latest.yml, sem acusar erro. Sem o latest.yml, ninguém recebe a atualização.
      - name: Publica na release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          arquivos=(dist/Agent-IDE-Setup-*.exe dist/Agent-IDE-Setup-*.exe.blockmap dist/latest.yml)
          ls -l "${arquivos[@]}"
          gh release create "$GITHUB_REF_NAME" "${arquivos[@]}" --title "${GITHUB_REF_NAME#v}" --generate-notes
          # Confere que a release ficou com os três arquivos completos.
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[] | "\(.name) \(.size)"'
          test "$(gh release view "$GITHUB_REF_NAME" --json assets -q '[.assets[] | select(.state == "uploaded")] | length')" = 3
